version: '3.8'

services:
  # 1. Database PostgreSQL 16
  postgres_db:
    image: postgres:16-alpine
    container_name: app_postgres
    restart: always
    environment:
      # Lấy dữ liệu an toàn từ file .env ở root
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Backend NestJS 11
  backend_api:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: app_backend
    restart: always
    ports:
      - '3000:3000'
    environment:
      # Lấy dữ liệu an toàn từ file .env ở root
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      - postgres_db

  # 3. Frontend React 19 + Vite 8
  frontend_web:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        # Bơm URL API từ file .env vào để React build
        - VITE_API_URL=${VITE_API_URL}
    container_name: app_frontend
    restart: always
    ports:
      - '8000:5173'
    depends_on:
      - backend_api

volumes:
  pgdata: